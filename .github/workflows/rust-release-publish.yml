name: Rust release publish (reusable)

# Tags, runs `cargo publish` (unless the caller's release-plz.toml sets
# publish = false), and creates the GitHub release. release-plz itself
# detects whether the pushed commit is a release-plz PR merge; this is
# safe to call unconditionally on every push to main.

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
