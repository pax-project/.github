name: Rust release publish (reusable)

# Tags, runs `cargo publish` (unless the caller's release-plz.toml sets
# publish = false), and creates the GitHub release. release-plz itself
# detects whether the pushed commit is a release-plz PR merge; this is
# safe to call unconditionally on every push to main.
#
# Exposes release-plz's outputs so the caller can chain follow-up jobs:
# a release created with GITHUB_TOKEN fires no `release` event.

on:
  workflow_call:
    outputs:
      releases_created:
        value: ${{ jobs.release.outputs.releases_created }}
      releases:
        description: release-plz's JSON array of {package_name, tag, version}
        value: ${{ jobs.release.outputs.releases }}
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
