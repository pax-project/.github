name: Rust release PR (reusable)

# Opens/updates the release-plz PR that bumps Cargo.toml + CHANGELOG.md for
# a caller repo. Call this from a thin per-repo workflow on push to main.
# Needs the caller repo's own `release-plz.toml` for per-repo settings
# (package name, publish flag, commit-parser config).

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
